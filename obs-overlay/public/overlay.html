<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Score overlay</title>
<style>
  /* Transparent page: OBS composites only the score bug. Size the browser source to 640x120. */
  html, body { margin: 0; background: transparent; font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
  #bug { display: inline-flex; align-items: stretch; margin: 12px; border-radius: 10px; overflow: hidden;
         background: rgba(12, 14, 20, 0.88); color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.35); font-size: 28px; }
  .team { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-left: 6px solid #666; }
  .abbr { font-weight: 700; letter-spacing: .04em; }
  .score { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
  .detail { display: flex; align-items: center; padding: 10px 18px; font-size: 20px; color: #cfd3dc; background: rgba(255,255,255,.06); white-space: nowrap; }
  .flash { animation: flash 1.2s ease-out 2; }
  @keyframes flash { 0% { background: #f5c518; color: #000; } 100% { background: transparent; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="bug" class="hidden" aria-live="polite">
  <div class="team" id="away"><span class="abbr"></span><span class="score"></span></div>
  <div class="team" id="home"><span class="abbr"></span><span class="score"></span></div>
  <div class="detail" id="detail"></div>
</div>
<script>
  // Usage: http://localhost:3030/?league=nba&team=BOS   (sport is inferred for US leagues; soccer: ?sport=soccer&league=eng.1)
  const params = new URLSearchParams(location.search);
  const query = new URLSearchParams({ league: params.get('league') || 'nba', team: params.get('team') || '' });
  if (params.get('sport')) query.set('sport', params.get('sport'));
  const REFRESH_MS = 15000; // the server caches upstream for 30 s, so this costs no extra API calls
  let last = null;

  function paint(id, side, scored) {
    const el = document.getElementById(id);
    el.querySelector('.abbr').textContent = side.abbr;
    el.querySelector('.score').textContent = side.score;
    el.style.borderLeftColor = side.color || '#666';
    if (scored) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }

  async function refresh() {
    try {
      const res = await fetch('/score?' + query);
      const g = await res.json();
      const bug = document.getElementById('bug');
      if (!res.ok || g.state === 'none') { bug.classList.add('hidden'); return; }
      const pre = g.state === 'pre';
      paint('away', { ...g.away, score: pre ? '' : g.away.score }, last && last.id === g.id && g.away.score > last.away.score);
      paint('home', { ...g.home, score: pre ? '' : g.home.score }, last && last.id === g.id && g.home.score > last.home.score);
      document.getElementById('detail').textContent = g.detail;
      bug.classList.remove('hidden');
      last = g;
    } catch (e) { /* keep showing the last score */ }
  }
  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
